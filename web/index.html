<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking Tracker</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2f7; color: #182230; }
    header { background: #173b6c; color: white; padding: 24px; text-align: center; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px #0001; }
    .status { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 20px; background: #dff3e5; color: #16733a; }
    img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Smart Parking Tracker</h1>
    <p>לוח בקרה לניהול חניה חכמה</p>
  </header>
  <main>
    <section class="cards">
      <article class="card">
        <h2>מכונית 1</h2>
        <img src="http://localhost:8081/images/car1.jpg" alt="מכונית 1">
        <span class="status">פעילה</span>
      </article>
      <article class="card">
        <h2>מכונית 2</h2>
        <img src="http://localhost:8081/images/car2.jpg" alt="מכונית 2">
        <span class="status">פעילה</span>
      </article>
    </section>
  </main>
</body>
</html>
